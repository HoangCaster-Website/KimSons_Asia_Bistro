<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Kim Son's Asia Bistro</title>
  <defs>
    <radialGradient id="lacquerCore" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#a82035"/>
      <stop offset="52%" stop-color="#781222"/>
      <stop offset="100%" stop-color="#3d0710"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="35%" stop-color="#e5b968"/>
      <stop offset="70%" stop-color="#c48e37"/>
      <stop offset="100%" stop-color="#8f5f18"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8943c"/>
      <stop offset="50%" stop-color="#f5dc9c"/>
      <stop offset="100%" stop-color="#b8822c"/>
    </linearGradient>
    <linearGradient id="ivoryCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f5e6cc"/>
    </linearGradient>
  </defs>

  <!-- Outer Imperial Seal Medallion -->
  <circle cx="64" cy="64" r="61" fill="url(#lacquerCore)" stroke="url(#goldFoil)" stroke-width="3"/>
  
  <!-- Ornamental Oriental Lattice Ring -->
  <circle cx="64" cy="64" r="54.5" fill="none" stroke="url(#goldSoft)" stroke-width="1.2" stroke-opacity="0.75"/>
  <circle cx="64" cy="64" r="50.5" fill="none" stroke="url(#goldFoil)" stroke-width="1.4" stroke-dasharray="6 4" stroke-opacity="0.65"/>

  <!-- 4 Cardinal Oriental Knot Ornaments -->
  <g stroke="url(#goldFoil)" stroke-width="1.6" fill="none" opacity="0.88">
    <rect x="60.5" y="5.5" width="7" height="7" rx="1" transform="rotate(45 64 9)"/>
    <rect x="60.5" y="115.5" width="7" height="7" rx="1" transform="rotate(45 64 119)"/>
    <rect x="5.5" y="60.5" width="7" height="7" rx="1" transform="rotate(45 9 64)"/>
    <rect x="115.5" y="60.5" width="7" height="7" rx="1" transform="rotate(45 119 64)"/>
  </g>

  <!-- Golden Dragon Pearl / Rising Sun Halo -->
  <circle cx="64" cy="39" r="13" fill="url(#goldFoil)" opacity="0.2"/>
  <circle cx="64" cy="39" r="8.5" fill="none" stroke="url(#goldFoil)" stroke-width="1.3" opacity="0.7"/>

  <!-- Chopsticks (Crossed / Parallel Fine-Dining Style) -->
  <path d="M36 42 L103 27" stroke="url(#goldFoil)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M36 48 L105 36" stroke="url(#goldSoft)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Rising Noodle Strands & Aromatic Steam -->
  <path d="M51 62 C51 48, 56 44, 56 32" fill="none" stroke="url(#goldFoil)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M60 62 C60 46, 65 42, 65 29" fill="none" stroke="#fff3cc" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M69 62 C69 48, 74 44, 74 34" fill="none" stroke="url(#goldFoil)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M43 55 C40 49, 45 45, 43 39" fill="none" stroke="url(#goldSoft)" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>

  <!-- Sculpted Porcelain & Gold Bowl -->
  <path d="M28 62 H100 C99 85, 84 99, 64 99 C44 99, 29 85, 28 62 Z" fill="url(#ivoryCore)" stroke="url(#goldFoil)" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Bowl Rim & Traditional Wave Accent -->
  <path d="M25 62 H103" stroke="url(#goldFoil)" stroke-width="4" stroke-linecap="round"/>
  <path d="M33 68 H95" stroke="#8c1828" stroke-width="1.1" stroke-opacity="0.35"/>

  <!-- Bowl Foot / Pedestal -->
  <path d="M49 99 H79 L76 106 H52 Z" fill="url(#goldFoil)" stroke="url(#goldSoft)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Monogram KS Embossed on the Bowl -->
  <text x="64" y="88" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="1.5" fill="#781222">KS</text>
</svg>
